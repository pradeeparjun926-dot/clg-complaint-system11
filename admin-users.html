<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Students | K.S.R. Complaint System</title>
<link rel="icon" href="assets/logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<main class="main">
<div class="page-title"><span class="big">👥</span><div><h1>Registered Students</h1><p>Students who can submit complaints</p></div></div>
<div class="panel"><div class="table-wrap" id="tbl"></div></div>
</main>
</div>
<script src="js/app.js"></script>
<script>
const user = appShell('users', 'admin');
if (user) {
  const students = db.get(KEY.users, []).filter(u => u.role === 'student');
  const all = Complaints.all();
  $('#tbl').innerHTML = students.length ? `<table><thead><tr><th>Name</th><th>Email</th><th>Register No.</th><th>Complaints</th></tr></thead><tbody>` +
    students.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(s.regNo)}</td><td>${all.filter(c => c.email === s.email).length}</td></tr>`).join('') + `</tbody></table>`
    : `<p class="empty">No students have registered yet.</p>`;
}
</script>
</body></html>
