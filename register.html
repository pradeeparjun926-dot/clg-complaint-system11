<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | K.S.R. Complaint System</title>
<link rel="icon" href="assets/logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<header class="topbar" id="topbar"></header>
<main class="auth-wrap">
  <form class="auth-card" id="regForm" novalidate>
    <h1>Register</h1>
    <p class="sub">Create your account</p>
    <div class="field"><div class="input-wrap"><span class="ico">👤</span><input id="name" placeholder="Name" autocomplete="name" aria-label="Name"></div></div>
    <div class="field"><div class="input-wrap"><span class="ico">✉️</span><input id="email" type="email" placeholder="Email Address" autocomplete="email" aria-label="Email address"></div></div>
    <div class="field"><div class="input-wrap"><span class="ico">🎓</span><input id="reg" placeholder="Register Number" aria-label="Register number"></div></div>
    <div class="field"><div class="input-wrap"><span class="ico">🔒</span><input id="pw" type="password" placeholder="Password" autocomplete="new-password" aria-label="Password"><button type="button" class="eye" aria-label="Show or hide password">👁</button></div></div>
    <div class="field"><div class="input-wrap"><span class="ico">🔒</span><input id="pw2" type="password" placeholder="Confirm Password" autocomplete="new-password" aria-label="Confirm password"></div></div>
    <p class="error-text" id="err" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit">Register</button>
    <p class="center-note">Already have an account? <a href="login.html">Login</a></p>
  </form>
  <img class="auth-art" src="assets/books.svg" alt="">
</main>
<script src="js/app.js"></script>
<script>
publicHeader(''); guestOnly(); bindEyeToggles();
$('#regForm').addEventListener('submit', e => {
  e.preventDefault();
  const d = { name: $('#name').value.trim(), email: $('#email').value.trim(), regNo: $('#reg').value.trim(), password: $('#pw').value };
  const err = m => $('#err').textContent = m;
  if (!d.name || !d.email || !d.regNo || !d.password) return err('Fill in all the fields.');
  if (!/^\S+@\S+\.\S+$/.test(d.email)) return err('Enter a valid email address.');
  if (d.password.length < 6) return err('Password must be at least 6 characters.');
  if (d.password !== $('#pw2').value) return err('Passwords do not match.');
  const r = Auth.register(d); if (r) return err(r);
  toast('Account created. Redirecting to login…'); setTimeout(() => location.href = 'login.html', 1200);
});
</script>
</body>
</html>
